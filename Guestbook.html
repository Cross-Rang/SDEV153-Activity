<head>
    <meta name="viewport" 
          content="width=device-width, initial-scale=1.0">
    <title>Guestbook</title>
    <link rel="stylesheet" href="main.css">
</head>

<a href="index.html" class="navbutton" tabindex="1">Go Back</a>

<header>
  <h1 align="center">Guest Cards</h1>
</header>
<sub>
  <h2 align="center">Yes, Hell has souvineurs!</h2>
    <p>Please fill out all fields for a personalized card just to say you visited. Note: In my testing this does not end up on the site. It's just a little souvineur.</p>
</sub>


<body>
    <div class="container">
        <form id="guestForm">
            <div class="form-input">
                <label for="name">Name:</label>
                <input tabindex="2" type="text" id="name" name="name" required>
            </div>
            
            <div class="form-input">
                <label for="site">How you found the site:</label>
                <input tabindex="3" type="text" id="site" name="site" required>
            </div>
            
            <div class="form-input">
                <label for="rating">Opinion:</label>
                <input tabindex="4" type="text" id="rating" name="rating" required>
            </div>
            
            <div class="form-input">
                <label for="comment">
                  Comment:
                  </label>
                <input tabindex="5" type="text" id="comment" name="comment" required>
            </div>
            
            <div class="btn">
                <button tabindex="6" type="submit">Submit</button>
            </div>
        </form>
        <div id="guestList"></div>
    </div>
    <script src="script.js"></script>
</body>
