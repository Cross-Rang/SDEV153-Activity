<header>
  <h1 align="center">Guestbook</h1>
</header>
<sub>
  <h2 align="center">How was the site? Leave some feedback, ask a question, or just say you were here!</h2>
</sub>
<body>
  <p>Please remember this site is public, do not share any personal information you wouldn't want online.</p>
</body>
        
<body>
    <div class="container">
        <h1>GuestBook</h1>
        <form id="guestForm">
            <div class="form-input">
                <label for="name">Name:</label>
                <input type="text" 
                       id="name" name="name" 
                       required>
            </div>
            <div class="form-input">
                <label for="address">Address:</label>
                <input type="text" 
                       id="address" name="address" 
                       required>
            </div>
            <div class="form-input">
                <label for="mobile">Mobile:</label>
                <input type="tel" 
                       id="mobile" name="mobile" 
                       required>
            </div>
            <div class="form-input">
                <label for="roomno">
                  Room Number:
                  </label>
                <input type="text" 
                       id="roomno" name="roomno" 
                       required>
            </div>
            <div class="btn"><button type="submit">
                    Add Guest
                </button></div>
        </form>
        <div id="guestList"></div>
    </div>
    <script src="script.js"></script>
</body>
