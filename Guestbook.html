<header>
  <h1 align="center">Guestbook</h1>
</header>
<sub>
  <h2 align="center">How was the site? Leave some feedback, ask a question, or just say you were here!</h2>
    <p></p>
</sub>


<body>
    <div class="container">
        <h1>Guest Book</h1>
        <form id="guestForm">
            <div class="form-input">
                <label for="name">Name:</label>
                <input type="text" 
                       id="name" name="name" 
                       required>
            </div>
            <div class="form-input">
                <label for="address">Comment:</label>
                <input type="text" 
                       id="address" name="address"
                        required>
            </div>
            <div class="btn"><button type="submit">
                    Submit
                </button></div>
        </form>
        <div id="guestList"></div>
    </div>
    <script src="script.js"></script>
</body>
